# Deploy the playable spike to GitHub Pages.
#
# Action versions are pinned to the latest RELEASE of each action, read from the GitHub API
# (checkout v7.0.1, configure-pages v6.0.0, upload-pages-artifact v5.0.0, deploy-pages v5.0.1).
#
# The first version of this file used the versions from GitHub's OWN starter workflow
# (actions/starter-workflows -> pages/static.yml) on the theory that it is the combination GitHub
# tests together. That run produced a deprecation annotation against exactly those pins:
#   "Node.js 20 is deprecated. actions/checkout@v4, actions/configure-pages@v5,
#    actions/upload-artifact@v4 ... are being forced to run on Node.js 24."
# The template is stale. The newer majors are correct, and the proof is that the annotation is
# gone from the next run — a better check than reading release notes.
name: deploy spike 001 to Pages

on:
  push:
    branches: [main]
    paths:
      - 'spikes/001-touch-controls/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Stage the playable files
        # The site ROOT is the game, so testing on a phone is one tap and no navigation.
        # The .pre-* backups and the fixed-vs-buggy twins stay in the repo but do not ship.
        run: |
          mkdir -p _site
          cp spikes/001-touch-controls/index.html   _site/
          cp spikes/001-touch-controls/harness.html _site/
          cp spikes/001-touch-controls/armory.html  _site/
          cp spikes/001-touch-controls/ladder.html  _site/
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
