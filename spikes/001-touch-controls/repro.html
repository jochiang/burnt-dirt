<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070b">
<title>Burnt Dirt · BUGGY TWIN (bug 1 + bug 2 reintroduced)</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05070b;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#e8e2d6;
    user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{position:fixed;inset:0;display:block;touch-action:none}

  /* ---------- HUD: a dedicated bottom band. The field is rendered ABOVE it, so the
       controls cannot occlude the battlefield, by construction. ---------- */
  #hud{position:fixed;left:0;right:0;bottom:0;height:104px;display:flex;flex-direction:row;
       align-items:center;justify-content:space-between;gap:6px;padding:5px;
       pointer-events:none;z-index:10}
  #hud.right{flex-direction:row-reverse}
  #hud .box{pointer-events:auto;background:rgba(8,11,16,.82);border:1px solid rgba(232,226,214,.14);
       border-radius:7px;padding:5px 6px;backdrop-filter:blur(6px)}
  .cluster{display:flex;align-items:center;gap:6px}
  .stack{display:flex;flex-direction:column;gap:3px}
  #logBox{width:min(38vw,330px);height:76px;overflow:hidden}

  /* ---------- column mode: the HUD takes a side pillar, field takes the rest.
       This is what a 4:3 field leaves you: 19.5:9 minus 4:3 = two fat pillars. ---------- */
  #hud.column{top:0;bottom:0;height:auto;width:176px;flex-direction:column;
       justify-content:center;align-items:stretch;gap:5px}
  #hud.column.left{left:0;right:auto}
  #hud.column:not(.left){left:auto;right:0}
  #hud.column .cluster{flex-direction:column;align-items:stretch;gap:5px}
  /* the column is 390px of screen with ~10 blocks to fit: be explicit about the grid rather
     than letting flex wrap decide (it chose 3 stat rows and overflowed both ends) */
  #hud.column .row{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  #hud.column .stat{padding:2px 4px;gap:3px}
  #hud.column .stat .v{font-size:15px}
  #hud.column .stat .k{font-size:7.5px}
  #hud.column .nudge button{width:17px;height:13px;font-size:8px}
  #hud.column #weapons{display:grid;grid-template-columns:1fr 1fr;gap:3px}
  #hud.column .chip{text-align:center;padding:4px 2px}
  #hud.column #logBox{height:auto;max-height:58px}
  #hud.column .ctl{flex-direction:column;align-items:stretch}
  #hud.column #pad{width:100%;height:62px}
  #hud.column #angleTrack{width:100%}
  #hud.column #fire{width:100%;height:34px}
  #hud.column #logBox{width:auto}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .mono{font-variant-numeric:tabular-nums}

  .stat{display:flex;align-items:baseline;gap:4px;background:rgba(255,255,255,.05);
        border-radius:5px;padding:3px 5px}
  .stat .k{font-size:8px;letter-spacing:.14em;color:#8b9bb0}
  .stat .v{font-size:17px;font-weight:700;line-height:1;color:#ffb454}
  .stat .v.wind{color:#7fd4ff}
  .stat .u{font-size:9px;color:#8b9bb0}
  .nudge{display:flex;flex-direction:column;gap:1px}
  .nudge button{width:19px;height:12px;font-size:9px;line-height:1;padding:0;
        background:rgba(255,255,255,.09);color:#e8e2d6;border:1px solid rgba(255,255,255,.16);
        border-radius:3px;font-family:inherit}
  .nudge button:active{background:#ffb454;color:#101418}

  .ctl{display:flex;gap:6px;align-items:stretch}
  #pad{width:68px;height:68px;border-radius:8px;border:1px dashed rgba(255,180,84,.5);
       background:repeating-linear-gradient(45deg,rgba(255,180,84,.05) 0 6px,transparent 6px 12px);
       display:flex;align-items:center;justify-content:center;font-size:7.5px;color:#c9975a;
       text-align:center;line-height:1.3;touch-action:none}
  #pad.drag{border-style:solid;background:rgba(255,180,84,.14)}
  #bars{display:none;flex-direction:column;gap:5px;justify-content:space-between}
  #angleTrack{position:relative;width:126px;height:24px;border-radius:5px;
       background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);touch-action:none}
  #angleKnob{position:absolute;top:-3px;width:9px;height:32px;margin-left:-4.5px;border-radius:3px;
       background:#ffb454;box-shadow:0 0 8px rgba(255,180,84,.6)}
  #pwrWrap{display:flex;gap:6px;align-items:center}
  #pwrTrack{position:relative;width:24px;height:54px;border-radius:5px;
       background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);touch-action:none}
  #pwrFill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,#7a3c14,#ffb454);
       border-radius:4px;height:50%}
  .trackLbl{font-size:7.5px;letter-spacing:.12em;color:#8b9bb0}

  #weapons{display:flex;gap:3px;flex-wrap:wrap}
  .chip{font-size:8px;letter-spacing:.06em;padding:4px 6px;border-radius:4px;
        background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);font-family:inherit;
        color:#c3cad4}
  .chip.on{background:#ffb454;color:#101418;border-color:#ffb454;font-weight:700}

  #fire{width:72px;height:38px;border-radius:8px;border:1px solid #ff5a3c;
        background:linear-gradient(180deg,rgba(255,90,60,.35),rgba(255,90,60,.12));
        color:#ffd8cd;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.14em}
  #fire:active{background:#ff5a3c;color:#12060a}
  #fire:disabled{opacity:.32}

  #log{font-size:8px;line-height:1.5;color:#8b9bb0;min-height:12px}
  #log b{color:#ffb454;font-weight:400}
  #fireCol{display:flex;flex-direction:column;gap:4px;justify-content:flex-end}
  .ctl{margin-bottom:4px}
  #weapons{margin-bottom:3px}

  #top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:4px;
       padding:5px;z-index:11;pointer-events:none}
  #top .box{pointer-events:auto;padding:3px 5px;background:rgba(8,11,16,.7);
       border:1px solid rgba(232,226,214,.13);border-radius:6px;display:flex;gap:3px;align-items:center}
  #top.padleft{padding-left:184px}
  #top.padright{padding-right:184px}
  .vbtn{font-size:8px;padding:3px 6px;border-radius:4px;background:rgba(255,255,255,.07);
        border:1px solid rgba(255,255,255,.13);color:#c3cad4;font-family:inherit}
  .vbtn.on{background:#7fd4ff;color:#08131a;border-color:#7fd4ff;font-weight:700}
  .tiny{font-size:7.5px;color:#6d7c90;letter-spacing:.06em}

  #banner{position:fixed;left:0;right:0;top:33%;text-align:center;pointer-events:none;z-index:9}
  #banner div{display:inline-block;font-size:12.5px;letter-spacing:.2em;padding:5px 12px;
       background:rgba(8,11,16,.72);border:1px solid rgba(232,226,214,.14);border-radius:7px}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;
        background:rgba(5,7,11,.72);flex-direction:column;gap:14px}
  #over h1{margin:0;font-size:22px;letter-spacing:.3em;color:#ffb454}
  #overBtn{padding:10px 20px;font-size:12px;letter-spacing:.18em;border-radius:7px;font-family:inherit;
        background:#ffb454;border:none;color:#101418;font-weight:700}
</style>
</head>
<body>
<canvas id="world"></canvas>

<div id="top">
  <div class="box">
    <span class="tiny">CTRL</span>
    <button class="vbtn" data-v="A">SPLIT PAD</button>
    <button class="vbtn" data-v="B">SLIDERS</button>
    <button class="vbtn" data-v="C">DIRECT</button>
  </div>
  <div class="box">
    <span class="tiny" id="saveLbl">—</span>
    <button class="vbtn" id="newBtn">NEW</button>
    <button class="vbtn" id="mirrorBtn">⇄ HAND</button>
    <button class="vbtn" id="fieldBtn">FIELD 4:3</button>
    <button class="vbtn" id="fsBtn">⛶</button>
  </div>
</div>

<div id="banner"><div id="bannerTxt">YOUR TURN</div></div>

<div id="over">
  <h1 id="overTxt">—</h1>
  <button id="overBtn">NEW ROUND</button>
</div>

<div id="hud" class="left">
  <div class="cluster">
  <div class="box">
    <div class="stack">
    <div class="row">
      <div class="stat"><span class="k">ANG</span><span class="v mono" id="angV">45</span><span class="u">°</span>
        <span class="nudge"><button data-n="a+1">▲</button><button data-n="a-1">▼</button></span>
      </div>
      <div class="stat"><span class="k">PWR</span><span class="v mono" id="pwrV">520</span>
        <span class="nudge"><button data-n="p+5">▲</button><button data-n="p-5">▼</button></span>
      </div>
      <div class="stat"><span class="k">WIND</span><span class="v wind mono" id="windV">0</span></div>
      <div class="stat"><span class="k">HP</span><span class="v mono" id="hpV">100</span></div>
    </div>
    <div id="weapons"></div>
    </div>
  </div>

  <div class="box">
    <div class="ctl">
      <div id="pad">DRAG<br>X · ANGLE<br>Y · POWER</div>
      <div id="bars">
        <div>
          <div class="trackLbl">ANGLE</div>
          <div id="angleTrack"><div id="angleKnob"></div></div>
        </div>
        <div id="pwrWrap">
          <div>
            <div class="trackLbl">PWR</div>
            <div id="pwrTrack"><div id="pwrFill"></div></div>
          </div>
          <div class="trackLbl" id="windLbl">WIND</div>
        </div>
      </div>
      <div id="fireCol">
        <button id="fire">FIRE</button>
        <div class="trackLbl" id="hapticLbl">haptics ?</div>
      </div>
    </div>
  </div>
  </div>
  <div class="box" id="logBox">
    <div class="trackLbl">SHOT LOG · bracket on it</div>
    <div id="log"></div>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   BURNT DIRT · spike 001 — one-thumb touch controls
   World is 700x250 logical px, fixed (a phone-landscape field, 2.8:1).
   Integer angle/power/wind, fixed timestep.
   Same inputs => identical trajectory, always.
   ============================================================ */

const HUD_BAND = 104;         // CSS height of the bottom control band (wide-field mode only;
                              // measured against what the row actually contains: the weapon
                              // chips wrap to two lines, so 86px clipped by 2)
const HUD_W = 176;            // CSS width of the side control column (4:3 field mode)
const GRAV = 0.06;            // px / tick^2
const WIND_A = 0.00009;       // px / tick^2 per unit of wind. Because VMAX scales with sqrt(W),
                              // wind drift stays a CONSTANT FRACTION of field width in both modes.
// Two field shapes, kept as a comparison rather than an argument. 'faithful' reproduces the
// original's proportions — 320x200 in a 4:3 display with non-square pixels, roughly 35
// tank-widths across. 'wide' spends the phone's full landscape width; ~63 tank-widths, so
// each tank is relatively smaller and the bracket matters more.
const FIELDS = {
  faithful: {w:400, h:300, hud:'column', label:'4:3'},
  wide:     {w:700, h:250, hud:'band',   label:'WIDE'},
};
let W = 400, H = 300;
let VMAX = 8;                 // recomputed by setField
const TANKW = 11, TANKH = 7;
const TICKS_PER_FRAME = 3;    // sim runs ~3x realtime: gap-sized shots

const WEAPONS = [
  {name:'BABY MSL', r:9,  dmg:22},
  {name:'MISSILE',  r:15, dmg:40},
  {name:'BABY NUKE',r:24, dmg:58},
  {name:'NUKE',     r:38, dmg:85},
  {name:'DIGGER',   r:11, dmg:18, tunnels:true},
  {name:'ROLLER',   r:30, dmg:60, rolls:true},
];

/* ---------- dom ---------- */
const $ = id => document.getElementById(id);
const canvas = $('world'), ctx = canvas.getContext('2d');
const terrainCanvas = document.createElement('canvas');
terrainCanvas.width = W; terrainCanvas.height = H;
const terrainCtx = terrainCanvas.getContext('2d');
let terrainImg = terrainCtx.createImageData(W, H);

/* ---------- state ---------- */
const state = {
  phase:'aim', turn:0, variant:'A', side:'left', field:'faithful',
  wIdx:1, wind:0, round:0, msg:'YOUR TURN', log:[], ghost:null, fx:[], seed:0,
  carves:[],          // every terrain-modifying op in order: the entire persistence story
};
let recording = true; // false while replaying a restore, so replays do not re-record
const player = {x:0, y:0, hp:100, angle:45, power:520, dead:false};
const enemy  = {x:0, y:0, hp:100, angle:135, power:520, dead:false};
let proj = null, mask = null, surf = null, terrainDirty = true;

/* ---------- rng (seeded: a match is reproducible) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd = mulberry32(1);

/* ---------- terrain ---------- */
function genTerrain(seed){
  rnd = mulberry32(seed);
  surf = new Float32Array(W);
  const anchor = new Uint8Array(W);
  surf[0] = H*(0.45+rnd()*0.28); anchor[0] = 1;
  surf[W-1] = H*(0.45+rnd()*0.28); anchor[W-1] = 1;
  // segment-recursive displacement: every midpoint divides a *known* pair, so no
  // index can be sampled before it exists. (Index-stepping breaks when W-1 is odd
  // and silently leaves NaN columns.)
  let segs = [[0, W-1]], rough = 1.0;
  while(segs.length){
    const next = [];
    for(const seg of segs){
      const a = seg[0], b = seg[1], m = (a+b)>>1;
      if(m <= a || m >= b) continue;
      surf[m] = (surf[a] + surf[b])/2 + (rnd()*2-1)*rough*H*0.19;
      anchor[m] = 1;
      next.push([a,m], [m,b]);
    }
    segs = next; rough *= 0.55;
  }
  // any column the halving skipped: interpolate between its known neighbours
  let prev = 0;
  for(let x=1;x<W;x++){
    if(!anchor[x]) continue;
    for(let k=prev+1;k<x;k++) surf[k] = surf[prev] + (surf[x]-surf[prev])*((k-prev)/(x-prev));
    prev = x;
  }
  for(let x=0;x<W;x++) surf[x] = Math.max(H*0.22, Math.min(H*0.90, surf[x]));
  const s2 = surf.slice();
  for(let x=1;x<W-1;x++) surf[x] = (s2[x-1] + s2[x]*2 + s2[x+1])/4;
  for(let x=0;x<W;x++) if(!Number.isFinite(surf[x])) surf[x] = H*0.75;
  rasterize();
}
function rasterize(){
  mask = new Uint8Array(W*H);
  for(let x=0;x<W;x++){
    const y0 = Math.round(surf[x]);
    for(let y=y0;y<H;y++) mask[y*W+x] = 1;
    surf[x] = y0;
  }
  terrainDirty = true;
}
function carve(cx, cy, r){
  // A crater is a literal coordinate, not a re-simulation, so a save survives any retune of
  // the ballistics. This is the whole reason persistence is cheap here.
  if(recording) state.carves.push([Math.round(cx), Math.round(cy), Math.round(r)]);
  const x0 = Math.max(0, Math.floor(cx-r)), x1 = Math.min(W-1, Math.ceil(cx+r));
  const y0 = Math.max(0, Math.floor(cy-r)), y1 = Math.min(H-1, Math.ceil(cy+r));
  const r2 = r*r;
  for(let y=y0;y<=y1;y++){
    const dy = y-cy, row = y*W;
    for(let x=x0;x<=x1;x++){
      const dx = x-cx;
      if(dx*dx+dy*dy <= r2) mask[row+x] = 0;
    }
  }
  for(let x=x0;x<=x1;x++){ let y=0; while(y<H && !mask[y*W+x]) y++; surf[x]=y; }
  terrainDirty = true;
}
function platform(cx, hw){
  for(let x=0;x<W;x++) if(!Number.isFinite(surf[x])) surf[x] = H*0.75;
  let top = H;
  for(let x=cx-hw;x<=cx+hw;x++){ const c=Math.max(0,Math.min(W-1,x)); top=Math.min(top,surf[c]); }
  for(let x=cx-hw;x<=cx+hw;x++){
    if(x<0||x>=W) continue;
    for(let y=0;y<top;y++) mask[y*W+x]=0;
    for(let y=top;y<H;y++) mask[y*W+x]=1;
    surf[x]=top;
  }
  terrainDirty = true;
}
function solid(x,y){
  if(x<0||x>=W) return false;
  if(y<0) return false;
  if(y>=H) return true;
  return mask[(y|0)*W + (x|0)] === 1;
}
function redrawTerrain(){
  const d = terrainImg.data;
  for(let y=0;y<H;y++){
    const row = y*W, t = y/H;
    const strata = (y % 9 === 0 || y % 9 === 1) ? -13 : (y % 9 === 5 ? 5 : 0);
    for(let x=0;x<W;x++){
      const i = (row+x)*4;
      if(mask[row+x]){
        // per-pixel dither + horizontal strata. The sin/cos version laid down a
        // visible plaid across the whole field.
        let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
        h = (h ^ (h >>> 13)) | 0;
        const n = (h & 15) - 7;
        d[i]   = 122 - 46*t + strata + n;
        d[i+1] =  84 - 32*t + strata + n;
        d[i+2] =  50 - 22*t + strata + n;
        d[i+3] = 255;
      } else { d[i+3] = 0; }
    }
  }
  terrainCtx.putImageData(terrainImg, 0, 0);
  terrainCtx.fillStyle = '#c99155';
  for(let x=0;x<W;x++){ const y=surf[x]; if(y<H) terrainCtx.fillRect(x,y,1,1); }
  terrainDirty = false;
}

/* ---------- match ---------- */
function newRound(keepSeed){
  if(!keepSeed) state.seed = (Math.random()*1e9)|0;
  genTerrain(state.seed);
  state.carves = [];
  state.wind = Math.round((rnd()*2-1)*100);
  state.round++;
  state.log = []; state.ghost = null; state.fx = []; proj = null;
  player.hp = 100; enemy.hp = 100; player.dead = false; enemy.dead = false;
  placeTanks();
  ai.last = {x:null, angle:enemy.angle, power:620};
  state.phase = 'aim'; state.msg = 'YOUR TURN';
  $('over').style.display = 'none';
  syncHud();
  save('new round');
}
function resetTank(t, tx, ang){
  tx = Math.max(22, Math.min(W-23, Math.round(tx)));
  platform(tx, 9);
  t.x = tx; t.y = surf[tx];
  t.angle = ang; t.power = 520; t.hp = 100; t.dead = false;
}
// Your tank sits on your control side, so eyes and thumb agree about where "you" are.
function placeTanks(){
  const pLeft = state.side === 'left';   // your tank on your control side; nothing occludes now
  resetTank(player, pLeft ? W*0.05 : W*0.95, pLeft ?  45 : 135);
  resetTank(enemy,  pLeft ? W*0.95 : W*0.05, pLeft ? 135 :  45);
}
function tankCy(t){ return t.y - TANKH*0.55; }

/* ---------- persistence ----------
   A match is reconstructible from three things: the terrain seed, the ordered list of
   literal carve ops, and the tank/AI/log state. The 120,000-byte mask is never stored.
   What it takes to survive a phone lock or a discarded background tab fits in ~1KB. */
const SAVE_KEY = 'scorched.save.v1';
let saveOK = true;

function snapshot(){
  return {
    v: 1, field: state.field, side: state.side, variant: state.variant,
    seed: state.seed, wind: state.wind, round: state.round, wIdx: state.wIdx,
    phase: state.phase, turn: state.turn,
    tanks: [
      {hp:player.hp, angle:player.angle, power:player.power, dead:player.dead},
      {hp:enemy.hp,  angle:enemy.angle,  power:enemy.power,  dead:enemy.dead},
    ],
    ai: {x:ai.last.x, angle:ai.last.angle, power:ai.last.power},
    carves: state.carves,
    log: state.log,
    ghost: state.ghost ? state.ghost.filter((_,i) => i%3 === 0)
                                   .map(p => [Math.round(p[0]), Math.round(p[1])]) : null,
    // a shot in the air when the screen went away is still in the air when it comes back
    proj: (proj && state.phase === 'flying') ? {
      owner: proj.owner, t: proj.t, wIdx: proj.wIdx,
      angle: proj.owner === 'player' ? player.angle : enemy.angle,
      power: proj.owner === 'player' ? player.power : enemy.power,
    } : null,
  };
}
function save(why){
  if(!saveOK) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot()));
    const d = new Date(), z = n => String(n).padStart(2,'0');
    $('saveLbl').textContent = 'SAVED ' + z(d.getHours()) + ':' + z(d.getMinutes()) +
                               ':' + z(d.getSeconds()) + (why ? ' · ' + why : '');
  } catch(e){
    saveOK = false;
    $('saveLbl').textContent = 'SAVE BLOCKED';
    $('saveLbl').style.color = '#ff8a6a';
  }
}
function readSave(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const sv = JSON.parse(raw);
    return (sv && sv.v === 1 && FIELDS[sv.field]) ? sv : null;
  } catch(e){ return null; }
}
function applySide(){
  const hud = $('hud');
  hud.classList.toggle('left',  state.side === 'left');
  hud.classList.toggle('right', state.side === 'right');
  resize(); chrome();
}
function restore(sv){
  state.side = sv.side === 'right' ? 'right' : 'left';
  state.variant = sv.variant || 'A';
  applySide();
  setVariant(state.variant);

  genTerrain(sv.seed);
  placeTanks();
  recording = false;                       // replay craters without re-recording them
  for(const c of (sv.carves || [])) carve(c[0], c[1], c[2]);
  recording = true;
  state.carves = (sv.carves || []).map(c => c.slice());

  player.hp = sv.tanks[0].hp; player.angle = sv.tanks[0].angle;
  player.power = sv.tanks[0].power; player.dead = sv.tanks[0].dead;
  enemy.hp  = sv.tanks[1].hp;  enemy.angle  = sv.tanks[1].angle;
  enemy.power = sv.tanks[1].power; enemy.dead = sv.tanks[1].dead;
  ai.last = {x: sv.ai.x, angle: sv.ai.angle, power: sv.ai.power};
  state.wind = sv.wind; state.round = sv.round; state.wIdx = sv.wIdx;
  state.log = (sv.log || []).slice();
  state.ghost = sv.ghost ? sv.ghost.map(p => [p[0], p[1]]) : null;
  state.fx = [];
  buildWeapons();

  if(sv.proj){
    const p = sv.proj;
    state.wIdx = p.wIdx;
    const t = p.owner === 'player' ? player : enemy;
    t.angle = p.angle; t.power = p.power;
    fire(p.owner);
    for(let i=0;i<p.t && state.phase === 'flying';i++) stepProj();
    state.log = (sv.log || []).slice();    // catching up may have logged the resolution
  } else if(sv.phase === 'over' || player.dead || enemy.dead){
    state.phase = 'over';
    state.msg = enemy.dead && !player.dead ? 'COMPUTER DESTROYED'
              : player.dead && !enemy.dead ? 'YOU WERE DESTROYED' : 'MUTUAL DESTRUCTION';
    $('overTxt').textContent = state.msg;
    $('over').style.display = 'flex';
  } else if(sv.phase === 'wait'){
    state.phase = 'wait'; state.turn = 1; setTimeout(aiTurn, 400);
  } else {
    state.phase = 'aim'; state.turn = 0;
  }
  if(state.phase === 'aim') state.msg = 'RESUMED · ROUND ' + state.round;
  syncHud();
  save('resumed');
}


/* ---------- firing & simulation ---------- */
function fire(who){
  const t = who === 'player' ? player : enemy;
  if(t.dead) return;
  const rad = t.angle*Math.PI/180;
  const v0 = t.power/1000*VMAX;
  const px = t.x + Math.cos(rad)*10, py = tankCy(t) - Math.sin(rad)*10;
  proj = { x:px, y:py, vx:Math.cos(rad)*v0, vy:-Math.sin(rad)*v0,
           path:[[px,py]], owner:who, w:WEAPONS[state.wIdx], wIdx:state.wIdx, t:0 };
  state.phase = 'flying';
  state.msg = who === 'player' ? 'IN FLIGHT' : 'COMPUTER FIRES';
  save('in flight');
  syncHud();
}
function stepProj(){
  if(!proj) return;
  const p = proj;
  p.t++;
  p.vx += state.wind*WIND_A;
  p.vy += GRAV;
  p.x += p.vx; p.y += p.vy;
  p.path.push([p.x,p.y]);
  if(p.path.length > 900) p.path.shift();

  for(const pair of [['player',player],['enemy',enemy]]){
    const k = pair[0], t = pair[1];
    if(t.dead || k === p.owner) continue;
    const dx = p.x - t.x, dy = p.y - tankCy(t);
    if(dx*dx + dy*dy < 34){ explode(p.x, p.y); return; }
  }
  if(p.y > H+4 || p.x < -1500 || p.x > W+1500){
    // report the REAL landing, not a clamped one: a clamped overshoot is a flat
    // signal and the bracketing maths downstream cannot tell 20px long from 1600px long
    endShot(Math.round(p.x), 'off'); return;
  }
  if(p.y >= 0 && solid(p.x, p.y)){
    if(p.w.tunnels){
      const n = p.path.length;
      for(let i=Math.max(0,n-22); i<n; i++) carve(p.path[i][0], p.path[i][1], p.w.r*0.9);
      state.fx.push({x:p.x, y:p.y, r:8, t:0, dig:true});
      endShot(Math.round(p.x), 'tunnelled');
      return;
    }
    if(p.w.rolls){ roller(p); return; }
    explode(p.x, p.y); return;
  }
}
function roller(p){
  let rx = Math.round(Math.max(1, Math.min(W-2, p.x)));
  let ry = Math.round(surf[rx]);
  const dir = p.vx >= 0 ? 1 : -1;
  for(let s=0;s<220;s++){
    const nx = rx + dir;
    if(nx < 1 || nx > W-2) break;
    for(const t of [player, enemy]){
      if(t.dead) continue;
      if(Math.abs(nx - t.x) < 6){ rx = nx; ry = surf[rx]; s = 999; break; }
    }
    if(s === 999) break;
    const ny = Math.round(surf[nx]);
    if(ny >= ry){ rx = nx; ry = ny; } else break;
  }
  explode(rx, ry - 2);
}
function explode(x, y){
  const w = proj.w;
  carve(x, y, w.r);
  state.fx.push({x, y, r:w.r, t:0});
  const R = w.r*1.7;
  for(const t of [player, enemy]){
    if(t.dead) continue;
    const dx = t.x - x, dy = tankCy(t) - y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if(d < R){ t.hp = Math.max(0, t.hp - Math.round(w.dmg*(1 - d/R))); }
  }
  endShot(Math.round(x), 'impact');
}
function endShot(landX, how){
  const who = proj.owner, w = proj.w;
  const tgt = who === 'player' ? enemy : player;
  state.log.unshift({
    who: who === 'player' ? 'YOU' : 'CPU',
    a: who === 'player' ? player.angle : enemy.angle,
    p: who === 'player' ? player.power : enemy.power,
    w: w.name, land: landX,
    // signed along the direction of fire, so "+" always reads as long, whoever fired
    err: landX === null ? null : (landX - tgt.x)*(who === 'player' ? 1 : -1),
  });
  if(who === 'player') state.ghost = proj.path;
  else ai.last.x = landX;                          // AI brackets its OWN last landing
  // the side column has room for 3 entries; the bottom band has room for 4
  if(state.log.length > (FIELDS[state.field].hud === 'column' ? 3 : 4)) state.log.pop();
  proj = null;
  player.dead = player.hp <= 0;
  enemy.dead = enemy.hp <= 0;
  syncHud();

  if(player.dead || enemy.dead){
    state.phase = 'over';
    state.msg = enemy.dead && !player.dead ? 'COMPUTER DESTROYED'
              : player.dead && !enemy.dead ? 'YOU WERE DESTROYED' : 'MUTUAL DESTRUCTION';
    $('overTxt').textContent = state.msg;
    $('over').style.display = 'flex';
    save('over');
    return;
  }
  if(who === 'player'){ state.phase = 'wait'; state.turn = 1; setTimeout(aiTurn, 520); }
  else { state.phase = 'aim'; state.turn = 0; state.msg = 'YOUR TURN'; }
  syncHud();
  save('turn');
}

/* ---------- AI: brackets, remembers, jitters ---------- */
const ai = { last:{x:null, angle:135, power:620} };
function aiTurn(){
  // phase-gated: a setTimeout queued before a background/resume must not fire a stray turn
  if(state.phase !== 'wait') return;
  if(enemy.hp < 45 && Math.random() < 0.5) state.wIdx = 3;
  else state.wIdx = Math.random() < 0.35 ? 1 : 0;

  const dir = Math.sign(player.x - enemy.x) || 1;   // -1: the computer fires leftward
  let p, a = ai.last.angle;
  if(ai.last.x === null){
    p = 430 + Math.abs(player.x - enemy.x)*0.30;    // deliberately crude ranging shot
  } else {
    // correct in RANGE space, not power space: range ~ power^2, so a linear power
    // step oscillates instead of converging. sens = d(range)/d(power) in px per unit.
    const errAlong = (ai.last.x - player.x)*dir;    // +ve = long
    const sens = Math.max(0.45, 2*VMAX*VMAX/(GRAV*1e6)*ai.last.power);
    p = ai.last.power - errAlong/sens + (Math.random()*2-1)*18;
  }
  if(p > 1000){ p = 1000; a = a === 135 ? 45 : 135; }
  if(p < 150){ p = 150; a = a === 135 ? 45 : 135; }
  ai.last.angle = a;
  ai.last.angle = a; ai.last.power = Math.round(p);
  enemy.angle = a; enemy.power = Math.round(p);
  fire('enemy');
}

/* ---------- effects ---------- */
function updateFx(){
  for(const f of state.fx) f.t++;
  state.fx = state.fx.filter(f => f.t < 26);
}

/* ---------- render ---------- */
let cw = 0, ch = 0, dpr = 1, fit = 1, ox = 0, oy = 0;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cw = window.innerWidth; ch = window.innerHeight;
  canvas.width = Math.floor(cw*dpr); canvas.height = Math.floor(ch*dpr);
  canvas.style.width = cw+'px'; canvas.style.height = ch+'px';
  const col = FIELDS[state.field].hud === 'column';
  const availW = cw - (col ? HUD_W : 0);
  const availH = ch - (col ? 0 : HUD_BAND);
  fit = Math.min(availW/W, availH/H);
  ox = (col && state.side === 'left' ? HUD_W : 0) + (availW - W*fit)/2;
  oy = (availH - H*fit)/2;
}
// swap the field shape (and everything that must scale with it)
function setField(mode, fresh){
  state.field = mode;
  const f = FIELDS[mode];
  W = f.w; H = f.h;
  VMAX = Math.sqrt(0.9*W*GRAV)/0.7;   // a 45deg shot at power 700 spans 90% of the field
  terrainCanvas.width = W; terrainCanvas.height = H;
  terrainImg = terrainCtx.createImageData(W, H);
  $('hud').classList.toggle('column', f.hud === 'column');
  $('fieldBtn').textContent = 'FIELD ' + f.label;
  chrome();
  resize();
  if(fresh !== false) newRound(false);   // a resume must not clobber the save it is about to read
}
// keep the top button bar clear of the side column when there is one
function chrome(){
  const col = FIELDS[state.field].hud === 'column';
  $('top').classList.toggle('padleft',  col && state.side === 'left');
  $('top').classList.toggle('padright', col && state.side === 'right');
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  const col = FIELDS[state.field].hud === 'column';
  const fieldH = col ? ch : ch - HUD_BAND;
  const sky = ctx.createLinearGradient(0,0,0,fieldH);
  sky.addColorStop(0, '#060a12'); sky.addColorStop(0.65, '#12202f'); sky.addColorStop(1, '#2a1c16');
  ctx.fillStyle = sky; ctx.fillRect(0,0,cw,fieldH);
  // the controls sit OUTSIDE the field: flat, so they never compete with it
  ctx.fillStyle = '#05070b';
  if(col) ctx.fillRect(state.side === 'left' ? 0 : cw - HUD_W, 0, HUD_W, ch);
  else    ctx.fillRect(0, ch - HUD_BAND, cw, HUD_BAND);

  if(terrainDirty) redrawTerrain();
  ctx.setTransform(dpr*fit, 0, 0, dpr*fit, dpr*ox, dpr*oy);

  // wind banner in the world itself — the field carries its own instrument
  drawWindFlag();

  if(state.ghost) drawPath(state.ghost, 'rgba(232,226,214,.16)', 1);
  ctx.drawImage(terrainCanvas, 0, 0);
  drawTank(player, '#7fd4ff');
  drawTank(enemy, '#ff5a3c');
  if(proj) drawPath(proj.path, 'rgba(255,180,84,.55)', 1);
  if(proj){ ctx.fillStyle = '#fff2d8'; ctx.beginPath(); ctx.arc(proj.x, proj.y, 2.2, 0, 6.3); ctx.fill(); }
  drawFx();
  if(proj && proj.owner === 'player') drawAimGuide();
}
function drawWindFlag(){
  const n = Math.abs(state.wind), cx = W/2, y = 42;   // clear of the top control bar
  ctx.save();
  ctx.fillStyle = 'rgba(232,226,214,.5)';
  ctx.font = '9px ui-monospace,monospace'; ctx.textAlign = 'center';
  ctx.fillText('WIND', cx, y-5);
  ctx.fillStyle = n === 0 ? 'rgba(232,226,214,.55)' : '#7fd4ff';
  ctx.fillText(String(n), cx, y+11);
  if(n > 0){
    const dir = state.wind > 0 ? 1 : -1;
    ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 1.4;
    for(let i=0;i<3;i++){
      const o = i*9, len = 10 + i*4;
      ctx.globalAlpha = 0.9 - i*0.22;
      ctx.beginPath();
      ctx.moveTo(cx + dir*(14+o), y+3);
      ctx.lineTo(cx + dir*(14+o+len), y+3);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawTank(t, color){
  if(t.dead){
    ctx.fillStyle = 'rgba(60,40,34,.9)';
    ctx.fillRect(t.x-6, t.y-4, 12, 4);
    return;
  }
  const x = t.x - TANKW/2, y = t.y - TANKH;
  ctx.fillStyle = color;
  ctx.fillRect(x, y, TANKW, TANKH);
  ctx.fillStyle = 'rgba(0,0,0,.42)';
  ctx.fillRect(x, y+TANKH-2, TANKW, 2);
  const rad = t.angle*Math.PI/180, bx = t.x, by = tankCy(t);
  ctx.strokeStyle = '#fff2d8'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(bx,by);
  ctx.lineTo(bx + Math.cos(rad)*10, by - Math.sin(rad)*10); ctx.stroke();
  // hp
  const w = 18, hx = t.x - w/2, hy = y - 6;
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(hx, hy, w, 2.5);
  ctx.fillStyle = t.hp > 55 ? '#8ce37f' : t.hp > 25 ? '#ffb454' : '#ff5a3c';
  ctx.fillRect(hx, hy, w*t.hp/100, 2.5);
}
function drawAimGuide(){
  const rad = player.angle*Math.PI/180, bx = player.x, by = tankCy(player);
  ctx.save();
  ctx.setLineDash([2,4]); ctx.strokeStyle = 'rgba(127,212,255,.35)'; ctx.lineWidth = 1;
  const len = 14 + player.power/1000*46;
  ctx.beginPath(); ctx.moveTo(bx,by);
  ctx.lineTo(bx + Math.cos(rad)*len, by - Math.sin(rad)*len); ctx.stroke();
  ctx.restore();
}
function drawPath(path, color, lw){
  if(path.length < 2) return;
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(path[0][0], path[0][1]);
  for(let i=1;i<path.length;i++) ctx.lineTo(path[i][0], path[i][1]);
  ctx.stroke();
}
function drawFx(){
  for(const f of state.fx){
    const p = f.t/26;
    if(f.dig){
      ctx.strokeStyle = `rgba(201,145,85,${0.8*(1-p)})`; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(f.x, f.y, 10*p + 2, 0, 6.3); ctx.stroke();
      continue;
    }
    ctx.strokeStyle = `rgba(255,150,70,${0.9*(1-p)})`;
    ctx.lineWidth = 2.4*(1-p)+0.6;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r*(0.35 + 1.15*p), 0, 6.3); ctx.stroke();
    ctx.fillStyle = `rgba(255,220,150,${0.5*(1-p)})`;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r*0.55*(1-p), 0, 6.3); ctx.fill();
  }
}

/* ---------- input: variant A, split pad ---------- */
const ANG_PX = 1.2, PWR_PX = 1.6;
let drag = null, lastDetentA = -1, lastDetentP = -1;
const HAS_VIB = typeof navigator.vibrate === 'function';
function haptic(){
  if(!HAS_VIB) return;
  if(Math.floor(player.angle/10) !== lastDetentA){ lastDetentA = Math.floor(player.angle/10); navigator.vibrate(4); }
  else if(Math.floor(player.power/50) !== lastDetentP){ lastDetentP = Math.floor(player.power/50); navigator.vibrate(4); }
}
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function canAim(){ return state.phase === 'aim' && !player.dead; }

const pad = $('pad');
pad.addEventListener('pointerdown', e => {
  if(!canAim()) return;
  try { pad.setPointerCapture(e.pointerId); } catch(_) {}   // throws for synthetic/unknown pointers
  drag = {x:e.clientX, y:e.clientY, a:player.angle, p:player.power};
  pad.classList.add('drag'); lastDetentA = -1; lastDetentP = -1;
});
pad.addEventListener('pointermove', e => {
  if(!drag || !canAim()) return;
  player.angle = clamp(Math.round(drag.a + (e.clientX - drag.x)/ANG_PX), 1, 180);
  player.power = clamp(Math.round(drag.p - (e.clientY - drag.y)/PWR_PX), 0, 1000);
  haptic(); syncHud();
});
const padUp = () => { drag = null; pad.classList.remove('drag'); };
pad.addEventListener('pointerup', padUp);
pad.addEventListener('pointercancel', padUp);

/* ---------- input: variant B, sliders ---------- */
const angleTrack = $('angleTrack'), pwrTrack = $('pwrTrack');
let sdrag = null;
angleTrack.addEventListener('pointerdown', e => {
  if(!canAim()) return;
  try { angleTrack.setPointerCapture(e.pointerId); } catch(_) {}
  sdrag = 'a'; setAngleFromX(e.clientX);
});
angleTrack.addEventListener('pointermove', e => { if(sdrag === 'a') setAngleFromX(e.clientX); });
function setAngleFromX(clientX){
  const r = angleTrack.getBoundingClientRect();
  player.angle = clamp(Math.round((clientX - r.left)/r.width*179) + 1, 1, 180);
  haptic(); syncHud();
}
pwrTrack.addEventListener('pointerdown', e => {
  if(!canAim()) return;
  try { pwrTrack.setPointerCapture(e.pointerId); } catch(_) {}
  sdrag = 'p'; setPowerFromY(e.clientY);
});
pwrTrack.addEventListener('pointermove', e => { if(sdrag === 'p') setPowerFromY(e.clientY); });
function setPowerFromY(clientY){
  const r = pwrTrack.getBoundingClientRect();
  player.power = clamp(Math.round((1 - (clientY - r.top)/r.height)*1000), 0, 1000);
  haptic(); syncHud();
}
['pointerup','pointercancel'].forEach(ev => document.addEventListener(ev, () => { sdrag = null; }));

/* ---------- input: variant C, direct aim ---------- */
let cdrag = false;
canvas.addEventListener('pointerdown', e => {
  if(state.variant !== 'C' || !canAim()) return;
  try { canvas.setPointerCapture(e.pointerId); } catch(_) {}
  cdrag = true; aimAt(e.clientX, e.clientY);
});
canvas.addEventListener('pointermove', e => { if(cdrag && state.variant === 'C') aimAt(e.clientX, e.clientY); });
['pointerup','pointercancel'].forEach(ev => canvas.addEventListener(ev, () => { cdrag = false; }));
function aimAt(clientX, clientY){
  const wx = (clientX - ox)/fit, wy = (clientY - oy)/fit;
  const dx = wx - player.x, dy = tankCy(player) - wy;
  let a = Math.atan2(dy, dx)*180/Math.PI;
  player.angle = clamp(Math.round(a), 1, 180);
  haptic(); syncHud();
}

/* ---------- nudges, weapons, fire, chrome ---------- */
document.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => {
  if(!canAim()) return;
  const n = b.dataset.n;
  if(n === 'a+1') player.angle = clamp(player.angle+1, 1, 180);
  if(n === 'a-1') player.angle = clamp(player.angle-1, 1, 180);
  if(n === 'p+5') player.power = clamp(player.power+5, 0, 1000);
  if(n === 'p-5') player.power = clamp(player.power-5, 0, 1000);
  syncHud();
}));
function buildWeapons(){
  const box = $('weapons'); box.innerHTML = '';
  WEAPONS.forEach((w,i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === state.wIdx ? ' on' : '');
    b.textContent = w.name;
    b.addEventListener('click', () => { if(canAim()){ state.wIdx = i; buildWeapons(); } });
    box.appendChild(b);
  });
}
$('fire').addEventListener('click', () => { if(canAim()) fire('player'); });

document.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => setVariant(b.dataset.v)));
function setVariant(v){
  state.variant = v;
  document.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('pad').style.display = v === 'A' ? 'flex' : 'none';
  $('bars').style.display = v === 'A' ? 'none' : 'flex';
  syncHud();
}
$('mirrorBtn').addEventListener('click', () => {
  state.side = state.side === 'left' ? 'right' : 'left';
  applySide();
  // re-seat the tanks only if nobody has committed a shot yet this round
  if(state.phase === 'aim' && state.log.length === 0) placeTanks();
  syncHud();
  save('mirrored');
});
$('fsBtn').addEventListener('click', async () => {
  let note = '';
  try {
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    note = 'fullscreen ✓';
  } catch(err){ note = 'fullscreen ✗'; }
  try {
    if(screen.orientation && screen.orientation.lock){ await screen.orientation.lock('landscape'); note += ' · lock ✓'; }
    else note += ' · lock ✗';
  } catch(err){ note += ' · lock ✗'; }
  state.msg = note; syncHud(); setTimeout(() => { state.msg = canAim() ? 'YOUR TURN' : state.msg; }, 1600);
});
$('overBtn').addEventListener('click', () => newRound(false));

/* ---------- hud sync ---------- */
function syncHud(){
  $('angV').textContent = player.angle;
  $('pwrV').textContent = player.power;
  $('windV').textContent = (state.wind > 0 ? '▶ ' : state.wind < 0 ? '◀ ' : '· ') + Math.abs(state.wind);
  $('hpV').textContent = player.hp;
  $('fire').disabled = !canAim();
  $('bannerTxt').textContent = canAim() ? (state.msg === 'YOUR TURN' ? `ROUND ${state.round} · YOUR TURN` : state.msg) : state.msg;
  $('hapticLbl').textContent = HAS_VIB ? 'detents 10°/50' : 'NO HAPTICS';
  $('hapticLbl').style.color = HAS_VIB ? '#6d7c90' : '#ff8a6a';
  $('angleKnob').style.left = ((player.angle-1)/179*100) + '%';
  $('pwrFill').style.height = (player.power/10) + '%';
  $('windLbl').textContent = 'WIND ' + (state.wind > 0 ? '+' : '') + state.wind;
  $('log').innerHTML = state.log.map(e => {
    const err = e.err === null ? '—' : (e.err > 0 ? '+' : '') + e.err + 'px';
    return `<div><b>${e.who}</b> ${e.a}° / ${e.p} · ${e.w} · ${err}</div>`;
  }).join('') || '<div>shot log: bracket on it</div>';
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  last = now;
  if(state.phase === 'flying'){
    for(let i=0;i<TICKS_PER_FRAME && state.phase === 'flying';i++) stepProj();
  }
  updateFx();
  render();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
// A phone lock, an app switch, a discarded background tab. pagehide + visibilitychange are
// the hooks that actually fire on mobile; beforeunload is not dependable there.
window.addEventListener('pagehide', () => save('backgrounded'));
window.addEventListener('blur',     () => save('lost focus'));
document.addEventListener('visibilitychange', () => { if(document.hidden) save('hidden'); });

/* ---------- boot ---------- */
buildWeapons();
setVariant('A');
const SAVED = readSave();                 // read before setField: it tells us which shape
setField(SAVED ? SAVED.field : 'faithful', !SAVED);
if(SAVED) restore(SAVED);
$('newBtn').addEventListener('click', () => newRound(false));
$('fieldBtn').addEventListener('click', () => {
  setField(state.field === 'faithful' ? 'wide' : 'faithful');
});
$('hapticLbl').textContent = HAS_VIB ? 'detents 10°/50' : 'NO HAPTICS';
requestAnimationFrame(frame);

// expose for scripted verification
window.__spike = {state, player, enemy, ai, aiTurn, fire, stepProj,
  get proj(){return proj;}, get mask(){return mask;}, get surf(){return surf;},
  WEAPONS, newRound, aimAt};
</script>
